<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DSA Master Question Bank</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }

  header { background: #1a1a2e; color: #fff; padding: 20px 24px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header p { font-size: 13px; color: #aaa; margin-top: 4px; }

  .stats { display: flex; gap: 24px; padding: 14px 24px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; align-items: center; }
  .stat .num { font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; color: #888; }
  .stat.total .num { color: #1a1a2e; }
  .stat.easy .num { color: #16a34a; }
  .stat.med .num { color: #d97706; }
  .stat.hard .num { color: #dc2626; }

  .progress-wrap { padding: 10px 24px 12px; background: #fff; border-bottom: 1px solid #e0e0e0; }
  .progress-bar { width: 100%; height: 7px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: #16a34a; border-radius: 99px; transition: width 0.3s; }
  .progress-label { font-size: 12px; color: #888; margin-bottom: 5px; }

  .controls { display: flex; gap: 8px; padding: 10px 24px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; align-items: center; }
  .controls input { padding: 5px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; flex: 1; min-width: 160px; }
  .controls input:focus { border-color: #1a1a2e; }
  .filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .fbtn { padding: 4px 12px; border: 1px solid #ddd; border-radius: 99px; font-size: 12px; background: #fff; cursor: pointer; color: #555; }
  .fbtn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
  .fbtn.easy.active { background: #16a34a; border-color: #16a34a; }
  .fbtn.med.active { background: #d97706; border-color: #d97706; }
  .fbtn.hard.active { background: #dc2626; border-color: #dc2626; }

  .page-wrap { max-width: 900px; margin: 0 auto; background: #fff; box-shadow: 0 0 0 1px #e0e0e0; }
  .main { padding: 16px 24px; }

  .part { margin-bottom: 14px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #fff; }
  .part-header { display: flex; align-items: center; padding: 10px 14px; cursor: pointer; user-select: none; background: #f8f8f8; border-bottom: 1px solid #eee; gap: 10px; }
  .part-header:hover { background: #f0f0f0; }
  .part-title { font-weight: 600; font-size: 14px; flex: 1; }
  .part-meta { font-size: 12px; color: #888; }
  .chevron { font-size: 11px; color: #aaa; transition: transform 0.2s; display: inline-block; }
  .part.closed .chevron { transform: rotate(-90deg); }
  .part-body { display: block; }
  .part.closed .part-body { display: none; }

  .section-label { padding: 6px 14px; font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.4px; background: #fafafa; border-bottom: 1px solid #f0f0f0; }

  .problem { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid #f0f0f0; }
  .problem:last-child { border-bottom: none; }
  .problem:hover { background: #fafafa; }
  .problem.done .prob-name { text-decoration: line-through; color: #aaa; }

  .prob-num { font-size: 12px; color: #bbb; min-width: 26px; }
  input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: #16a34a; flex-shrink: 0; }
  .prob-name { font-size: 13px; flex: 1; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; font-weight: 600; flex-shrink: 0; }
  .badge.Easy { background: #dcfce7; color: #16a34a; }
  .badge.Med { background: #fef3c7; color: #d97706; }
  .badge.Hard { background: #fee2e2; color: #dc2626; }
  .prob-hint { font-size: 11px; color: #bbb; flex-shrink: 0; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prob-link { font-size: 12px; color: #1a1a2e; text-decoration: none; border: 1px solid #ddd; border-radius: 4px; padding: 2px 7px; flex-shrink: 0; }
  .prob-link:hover { background: #1a1a2e; color: #fff; }

  .empty { padding: 32px; text-align: center; color: #aaa; font-size: 14px; }

  @media(max-width:600px){
    .prob-hint { display: none; }
    .main { padding: 10px; }
    header, .stats, .controls, .progress-wrap { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>

</div>

<div class="main" id="main"></div>

const STORAGE_KEY = 'dsa_tracker_v1';
let done = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let filter = 'all';
let search = '';

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...done]));
}

function toggle(n) {
  done.has(n) ? done.delete(n) : done.add(n);
  save();
  updateStats();
  const row = document.getElementById('row-' + n);
  if (row) {
    row.classList.toggle('done', done.has(n));
    if ((filter === 'todo' && done.has(n)) || (filter === 'done' && !done.has(n))) {
      row.style.display = 'none';
    }
  }
}

function updateStats() {
  let easy = 0, med = 0, hard = 0;
  DATA.forEach(p => p.sections.forEach(s => s.problems.forEach(q => {
    if (!done.has(q.n)) return;
    if (q.diff === 'Easy') easy++;
    else if (q.diff === 'Med') med++;
    else hard++;
  })));
  const total = done.size;
  document.getElementById('s-done').textContent = total;
  document.getElementById('s-easy').textContent = easy;
  document.getElementById('s-med').textContent = med;
  document.getElementById('s-hard').textContent = hard;
  const pct = Math.round(total / 237 * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${total} of 237 completed (${pct}%)`;
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function setSearch(v) {
  search = v.toLowerCase();
  render();
}

function matches(q) {
  if (search && !q.name.toLowerCase().includes(search)) return false;
  if (filter === 'done' && !done.has(q.n)) return false;
  if (filter === 'todo' && done.has(q.n)) return false;
  if (filter === 'Easy' && q.diff !== 'Easy') return false;
  if (filter === 'Med' && q.diff !== 'Med') return false;
  if (filter === 'Hard' && q.diff !== 'Hard') return false;
  return true;
}

function togglePart(pi) {
  const el = document.getElementById('part-' + pi);
  el.classList.toggle('closed');
}

function render() {
  const container = document.getElementById('main');
  let html = '';
  let anyResult = false;

  DATA.forEach((part, pi) => {
    let partHtml = '';
    let partVisible = 0;

    part.sections.forEach(sec => {
      const visible = sec.problems.filter(matches);
      if (!visible.length) return;
      partVisible += visible.length;
      anyResult = true;
      partHtml += `<div class="section-label">${sec.label}</div>`;
      visible.forEach(q => {
        partHtml += `<div class="problem${done.has(q.n) ? ' done' : ''}" id="row-${q.n}">
          <span class="prob-num">#${q.n}</span>
          <input type="checkbox" id="cb-${q.n}" ${done.has(q.n) ? 'checked' : ''} onchange="toggle(${q.n})"/>
          <span class="prob-name">${q.name}</span>
          <span class="badge ${q.diff}">${q.diff}</span>
          <span class="prob-hint">${q.hint}</span>
          <a class="prob-link" href="${q.link}" target="_blank">Open ↗</a>
        </div>`;
      });
    });

    if (!partVisible) return;

    const partDone = part.sections.reduce((a, s) => a + s.problems.filter(q => done.has(q.n)).length, 0);
    const partTotal = part.sections.reduce((a, s) => a + s.problems.length, 0);

    html += `<div class="part" id="part-${pi}">
      <div class="part-header" onclick="togglePart(${pi})">
        <span class="part-title">${part.part}</span>
        <span class="part-meta">${partDone}/${partTotal} done</span>
        <span class="chevron">▼</span>
      </div>
      <div class="part-body">${partHtml}</div>
    </div>`;
  });

  if (!anyResult) html = '<div class="empty">No problems match your filter.</div>';
  container.innerHTML = html;
}

updateStats();
render();
</script>
</body>
</html>
